services:
  - type: web
    name: uma-descuentos-corporativos
    runtime: static
    branch: main
    buildCommand: npm run build && npm run check && npm test
    staticPublishPath: web-dist
    routes:
      - type: rewrite
        source: /tesoreria
        destination: /index.html
      - type: rewrite
        source: /estudiantes
        destination: /estudiantes.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src blob:; connect-src 'self' https://uma-descuentos-corporativos-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /config.json
        name: Cache-Control
        value: no-store
      - path: /uma-logo.jpg
        name: Cache-Control
        value: public, max-age=300, no-transform
      - path: /transport.js
        name: Cache-Control
        value: no-store
      - path: /
        name: Cache-Control
        value: no-store
  - type: web
    name: uma-descuentos-corporativos-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: node --check api/server.mjs
    startCommand: npm run start:api
    healthCheckPath: /healthz
