<style>
:root{--brand:#c8164a;--ink:#1f2328;--muted:#656d76;--line:#d8dee4;--soft:#f6f8fa;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
a{color:#0969da}
:focus-visible{outline:2px solid #0969da;outline-offset:1px}
.hidden{display:none!important}
.skip{position:fixed;top:-60px;left:8px;background:#fff;padding:8px 12px;border:1px solid var(--line);z-index:50}
.skip:focus{top:8px}
h2{font-size:18px;margin:0}
h3{font-size:14px;margin:20px 0 8px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:40px;width:auto;display:block}
.brand strong{display:block;font-size:15px}
.brand span{color:var(--muted);font-size:13px}
.account{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--soft)}
.tab{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);white-space:nowrap}
.tab span{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:#eaeef2;color:var(--ink);font-size:12px;text-align:center}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--brand);background:#fff}
.progress{height:2px;background:var(--brand);animation:load 1s ease-in-out infinite;transform-origin:left}
@keyframes load{0%{transform:scaleX(.05)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:0}}
main{padding:16px 20px 32px}

.button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:5px 12px;white-space:nowrap}
.button:hover:not(:disabled){background:#eef1f4}
.button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.button.primary:hover:not(:disabled){background:#a91240}
.link{border:0;background:none;color:#0969da;padding:0}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;min-height:32px}
textarea{width:100%;min-height:110px;resize:vertical}
.banner{margin:0 0 12px;padding:8px 12px;border:1px solid #d4a72c66;background:#fff8c5;border-radius:6px}
.banner button{margin-left:8px}
.hint,.sub{color:var(--muted);font-size:13px}
.hint{margin:0 0 10px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.toolbar #search{width:240px}
.toolbar select{max-width:170px}
.toolbar input[type=date]{width:130px}
.date{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.spacer{flex:1}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--soft);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #eaeef2;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
table.apps tbody tr{cursor:pointer}
table.apps tbody tr:hover{background:#f6f8fa}
td small{display:block;color:var(--muted);font-size:12px}
td.nowrap{white-space:nowrap}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:32px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:13px}
.status{white-space:nowrap;font-weight:500}
.status.OBSERVADA,.status.UNCERTAIN{color:var(--warn)}
.status.APLICADA_SIGU,.status.SENT{color:var(--ok)}
.status.ERROR{color:var(--bad)}
.alert-mark{color:var(--warn);font-size:12px;display:block}
.alert-mark.bad{color:var(--bad)}

dialog{border:1px solid var(--line);border-radius:8px;padding:0;color:var(--ink);box-shadow:0 8px 24px #1f232826}
dialog::backdrop{background:#1f232859}
.detail-dialog{width:min(1200px,96vw);max-height:94vh;overflow:auto}
.detail-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.detail-nav{display:flex;align-items:center;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}
.detail-left{padding:16px;border-right:1px solid var(--line);min-width:0}
.detail-right{padding:16px;background:var(--soft)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.alerts{border:1px solid #d4a72c66;background:#fff8c5;border-radius:6px;padding:8px 12px;margin-bottom:14px}
.alerts ul{margin:4px 0 6px;padding-left:18px}
.error{border:1px solid #ff818266;background:#ffebe9;border-radius:6px;padding:8px 12px;margin-bottom:14px}
.docs{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px}
.docs li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-top:1px solid #eaeef2}
.docs li:first-child{border-top:0}
.docs li.rev{background:var(--soft);font-size:12px;color:var(--muted);font-weight:600}
.docs li.active{background:#ddf4ff}
.docs .name{overflow-wrap:anywhere}
.docs .actions{display:flex;gap:10px;flex-shrink:0}
.preview{width:100%;height:560px;border:1px solid var(--line);border-radius:6px;margin-top:10px;display:block;background:var(--soft)}
.log{margin:0;padding-left:18px;color:var(--ink)}
.log li{margin-bottom:4px}
.log small{color:var(--muted)}
.decision label{display:block;margin:10px 0 4px;font-weight:600}
.decision select{width:100%}
.radio{display:flex;gap:8px;align-items:center;font-weight:400!important;margin:6px 0!important}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:400!important}
.check input{margin-top:3px}
.decision .button.primary{width:100%;margin-top:12px;padding:7px}
.decision input[type=text]{width:100%}
.note{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px}
.mail{padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.confirm-dialog{width:min(460px,94vw);padding:16px}
.confirm-dialog p{color:var(--muted)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;z-index:60;max-width:92vw}
.toast.error{background:var(--bad)}

@media(max-width:900px){.detail-grid{grid-template-columns:1fr}.detail-left{border-right:0;border-bottom:1px solid var(--line)}.preview{height:420px}}
@media(max-width:640px){.topbar,.tabs,main{padding-left:12px;padding-right:12px}.brand img{height:32px}.account span{display:none}.toolbar #search,.toolbar select{width:100%;max-width:none}.spacer{display:none}th:nth-child(3),td:nth-child(3),th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}.detail-header{flex-wrap:wrap}.preview{height:360px}}
</style>
