<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels = {
  RECIBIDA:'Recibida', EN_REVISION:'En revisión', OBSERVADA:'Observada', CORRECCION_RECIBIDA:'Corrección recibida',
  VALIDADA_PENDIENTE_SIGU:'Validada, pendiente SIGU', APLICADA_SIGU:'Aplicada en SIGU',
  PENDING:'En cola', SENDING:'Enviando', SENT:'Aceptado por Google', UNCERTAIN:'Requiere comprobación', CANCELLED:'Reemplazado',
  DONE:'Procesado', ERROR:'Con error', PROCESSING:'Procesando'
};
const emailTypes = {APPROVED:'Aprobación', OBSERVED:'Observación', RECEIVED:'Acuse de recepción'};
const VIEWS = {
  pending:      {filter:{pendingOnly:true}},
  review:       {filter:{queue:'review'}},
  observed:     {filter:{status:'OBSERVADA'}},
  approved:     {filter:{status:'APLICADA_SIGU'}},
  applications: {filter:{}},
  emails:       {}
};
const PAGE_SIZE = 25;
let boot, view = 'pending', page = 1, total = 0, queue = '', ids = [], detail = null, pendingDecision = null;
let busyCount = 0, searchTimer, listRequest = 0, previewObjectUrl = null;

const date = v => v ? new Intl.DateTimeFormat('es-PE', {dateStyle:'short', timeStyle:'short', timeZone:'America/Lima'}).format(new Date(v)) : '—';
const status = s => `<span class="status ${esc(s)}">${esc(labels[s] || s || '—')}</span>`;
const issueLines = a => String(a.issues || '').split('\n').map(s => s.trim()).filter(Boolean);
const initials = n => String(n || '').replace(/^gestión:/, '').split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(v => v[0]).join('').toUpperCase() || '·';
/** Shows a spinner inside a button while an action runs and prevents double clicks. */
async function withButton(button, task) {
  if (!button) return task();
  button.classList.add('is-loading'); button.disabled = true;
  try { return await task(); } finally { button.classList.remove('is-loading'); button.disabled = false; }
}
function skeletonRows(columns, count = 6) {
  const cell = i => i === 0 ? '<td><div class="student"><span class="avatar skeleton"></span><div style="flex:1"><span class="skeleton mid"></span><span class="skeleton short" style="margin-top:6px"></span></div></div></td>' : i === columns - 1 ? '<td><span class="skeleton pill"></span></td>' : '<td><span class="skeleton"></span></td>';
  return Array.from({length:count}, () => `<tr class="loading-row">${Array.from({length:columns}, (_, i) => cell(i)).join('')}</tr>`).join('');
}

function toast(message, error = false) {
  $('toast').textContent = message; $('toast').className = 'toast' + (error ? ' error' : '');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => $('toast').classList.add('hidden'), error ? 8000 : 4000);
}
function handle(error) { toast(error.message || String(error), true); }

async function api(method, ...args) {
  if (++busyCount === 1) $('progress').classList.remove('hidden');
  try {
    if (window.UMA_DEMO) return await window.UMA_DEMO.call(method, ...args);
    if (window.UMA_REMOTE) return await window.UMA_REMOTE.call(method, ...args);
    if (!window.google?.script?.run) throw new Error('Abra el panel desde el despliegue autorizado.');
    return await new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));
  } finally {
    if (--busyCount === 0) $('progress').classList.add('hidden');
  }
}

/* ---------- List ---------- */
function filters() {
  const base = VIEWS[view]?.filter || {};
  return {...base, query:$('search').value.trim(), status:base.status || $('statusFilter').value, discount:$('discountFilter').value,
    school:$('schoolFilter').value, from:$('fromFilter').value, to:$('toFilter').value, queue:queue || base.queue || ''};
}
function choices(id, values) {
  while ($(id).options.length > 1) $(id).remove(1);
  values.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = labels[v] || v; $(id).append(o); });
}
function renderCounts(s) {
  $('navPending').textContent = s.pending; $('navReview').textContent = s.toReview ?? 0; $('navObserved').textContent = s.observed;
  $('navApplied').textContent = s.applied; $('navTotal').textContent = s.total;
  const notes = [];
  if (s.attention) notes.push(`${s.attention} solicitud${s.attention === 1 ? '' : 'es'} con alertas.<button class="link" data-attention>Ver</button>`);
  if (s.emailUncertain) notes.push(`${s.emailUncertain} correo(s) requieren comprobación.<button class="link" data-goto="emails">Ver</button>`);
  if (s.unlinked) notes.push(`${s.unlinked} envío(s) del formulario aún no se pudieron procesar; el sistema los reintenta.`);
  $('attentionBar').innerHTML = notes.join(' &nbsp;·&nbsp; ');
  $('attentionBar').classList.toggle('hidden', !notes.length);
}
function applicationRow(a) {
  const alerts = issueLines(a).length;
  return `<tr data-open="${esc(a.id)}" tabindex="0">
    <td><div class="student"><span class="avatar">${esc(initials(a.name))}</span><div><strong>${esc(a.name || 'Sin nombre')}</strong><small>${esc(a.identityType)} ${esc(a.identityNumber)} · <span class="code">${esc(a.id)}</span></small></div></div></td>
    <td data-label="Correo">${esc(a.institutionalEmail || '—')}</td>
    <td><span class="chip">${esc(a.discount || '—')}</span></td>
    <td class="num">${esc(a.submissions || 1)}</td>
    <td data-label="Último envío">${date(a.lastSubmissionAt || a.createdAt)}${Number(a.submissions) > 1 ? `<span class="m-only"> · ${esc(a.submissions)} envíos</span>` : ''}</td>
    <td>${status(a.status)}${alerts ? `<span class="flag">${alerts} alerta${alerts === 1 ? '' : 's'}</span>` : ''}${a.processingError ? '<span class="flag bad">Error en documentos</span>' : ''}</td></tr>`;
}
async function loadApplications() {
  const request = ++listRequest;
  if (!$('applicationRows').querySelector('tr[data-open]')) $('applicationRows').innerHTML = skeletonRows(6);
  else $('applicationRows').style.opacity = '.55';
  let result;
  try { result = await api('listApplications', filters(), page, PAGE_SIZE); }
  finally { if (request === listRequest) $('applicationRows').style.opacity = ''; }
  if (request !== listRequest) return;
  total = result.total; ids = result.ids || result.rows.map(r => r.id);
  renderCounts(result.stats);
  $('applicationRows').innerHTML = result.rows.length ? result.rows.map(applicationRow).join('') : `<tr><td colspan="6" class="empty"><strong>No hay solicitudes aquí</strong>${result.stats.total ? 'Pruebe otra pestaña o cambie los filtros.' : 'Las respuestas del formulario de estudiantes aparecerán automáticamente.'}</td></tr>`;
  $('paginationText').textContent = total ? `${(page - 1) * PAGE_SIZE + 1}–${Math.min(page * PAGE_SIZE, total)} de ${total}` : '';
  $('prevPage').disabled = page <= 1; $('nextPage').disabled = page * PAGE_SIZE >= total;
}
/* Each tab keeps its own search and filters. */
const FILTER_FIELDS = ['search','statusFilter','discountFilter','schoolFilter','fromFilter','toFilter'];
const tabFilters = {};
function saveTabFilters() { if (VIEWS[view]?.filter) tabFilters[view] = {queue, values:Object.fromEntries(FILTER_FIELDS.map(id => [id, $(id).value]))}; }
function restoreTabFilters() {
  const saved = tabFilters[view] || {queue:'', values:{}};
  FILTER_FIELDS.forEach(id => { $(id).value = saved.values[id] || ''; });
  queue = saved.queue || '';
  document.querySelectorAll('[data-queue]').forEach(c => c.classList.toggle('active', c.dataset.queue === queue));
}
function updateClearButton() {
  const fixed = VIEWS[view]?.filter?.status;
  const active = FILTER_FIELDS.some(id => $(id).value && !(id === 'statusFilter' && fixed)) || !!queue;
  $('clearFilters').classList.toggle('hidden', !active);
}
async function navigate(next) {
  saveTabFilters();
  view = VIEWS[next] ? next : 'pending'; page = 1;
  document.querySelectorAll('.tab').forEach(b => { const on = b.dataset.view === view; b.classList.toggle('active', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
  $('applicationsPanel').classList.toggle('hidden', view === 'emails'); $('emailsPanel').classList.toggle('hidden', view !== 'emails');
  if (view === 'emails') return loadEmails();
  restoreTabFilters();
  const fixed = VIEWS[view].filter.status;
  if (fixed) $('statusFilter').value = fixed; $('statusFilter').disabled = !!fixed;
  $('queueChips').classList.toggle('hidden', view !== 'pending');
  updateClearButton();
  $('applicationRows').innerHTML = '';
  await loadApplications();
}

/* ---------- Documents ---------- */
function releasePreview() { if (previewObjectUrl) { URL.revokeObjectURL(previewObjectUrl); previewObjectUrl = null; } }
function fileBlob(file) {
  const allowed = ['application/pdf','image/jpeg','image/png','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];
  if (!file || !allowed.includes(file.mimeType) || typeof file.data !== 'string' || file.data.length > 16 * 1024 * 1024) throw new Error('Archivo inválido');
  return new Blob([Uint8Array.from(atob(file.data), v => v.charCodeAt(0))], {type:file.mimeType});
}
function downloadFile(file) {
  const url = URL.createObjectURL(fileBlob(file)), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const fileCache = new Map();
function documentFile(fileId) {
  const key = detail.application.id + ':' + fileId;
  if (!fileCache.has(key)) {
    if (fileCache.size > 12) fileCache.delete(fileCache.keys().next().value);
    fileCache.set(key, api('getDocumentFile', detail.application.id, fileId).catch(e => { fileCache.delete(key); throw e; }));
  }
  return fileCache.get(key);
}
/* Full-screen document viewer: every document of the application, newest revision first. */
let viewerList = [], viewerIndex = 0, viewerFile = null;
function viewerDocuments() {
  const docs = (detail?.documents || []).slice();
  return docs.sort((x, y) => Number(y.revision) - Number(x.revision) || (x.kind === 'socioeconomic' ? -1 : 1));
}
async function openViewer(fileId) {
  viewerList = viewerDocuments(); viewerIndex = Math.max(0, viewerList.findIndex(d => d.fileId === fileId));
  if (!$('viewerDialog').open) $('viewerDialog').showModal();
  await showViewerDocument();
}
async function showViewerDocument() {
  const d = viewerList[viewerIndex], id = detail.application.id; if (!d) return;
  $('viewerTitle').textContent = d.kind === 'socioeconomic' ? 'Ficha socioeconómica' : 'Documento sustentatorio';
  $('viewerSub').textContent = `${detail.application.name} · Revisión ${d.revision} · ${d.name}`;
  $('viewerPosition').textContent = `${viewerIndex + 1} de ${viewerList.length}`;
  $('viewerPrev').disabled = viewerIndex <= 0; $('viewerNext').disabled = viewerIndex >= viewerList.length - 1;
  $('viewerLoading').classList.remove('hidden'); viewerFile = null;
  try {
    const file = await documentFile(d.fileId);
    if (!detail || detail.application.id !== id || viewerList[viewerIndex] !== d) return;
    releasePreview(); previewObjectUrl = URL.createObjectURL(fileBlob(file)); viewerFile = file;
    const image = file.mimeType.startsWith('image/');
    $('viewerImage').classList.toggle('hidden', !image); $('viewerFrame').classList.toggle('hidden', image);
    if (image) { $('viewerImage').src = previewObjectUrl; $('viewerImage').alt = d.name; $('viewerFrame').src = 'about:blank'; }
    else { $('viewerFrame').src = previewObjectUrl + '#view=FitH'; $('viewerImage').removeAttribute('src'); }
  } catch (error) { handle(error); }
  finally { $('viewerLoading').classList.add('hidden'); }
}
function viewerStep(offset) { const next = viewerIndex + offset; if (next < 0 || next >= viewerList.length) return; viewerIndex = next; showViewerDocument(); }
function closeViewer() { $('viewerFrame').src = 'about:blank'; $('viewerImage').removeAttribute('src'); releasePreview(); viewerFile = null; }

/* ---------- Application ---------- */
function documentList(documents, current) {
  if (!documents.length) return '<p class="note hint">Sin documentos procesados.</p>';
  const revisions = [...new Set(documents.map(d => Number(d.revision)))].sort((a, b) => b - a);
  return '<ul class="docs">' + revisions.map(rev => `<li class="rev">Revisión ${rev}${rev === Number(current) ? ' · actual' : ''}</li>` +
    documents.filter(d => Number(d.revision) === rev).map(d => `<li><span class="name"><span class="ui-icon" data-icon="file"></span><span><strong>${d.kind === 'socioeconomic' ? 'Ficha socioeconómica' : 'Documento sustentatorio'}</strong><small class="sub">${esc(d.name)}</small></span></span><span class="actions"><button class="link" data-preview="${esc(d.fileId)}">Ver</button><button class="link" data-download="${esc(d.fileId)}">Descargar</button></span></li>`).join('')).join('') + '</ul>';
}
function decisionPanel(a) {
  if (a.status === 'APLICADA_SIGU') return '<p class="note">El descuento ya fue aplicado en SIGU.</p>';
  if (a.status === 'OBSERVADA') return `<p class="note">Esperando la corrección del estudiante. La solicitud sigue pendiente; el enlace de corrección vence el ${date(a.correctionExpiresAt)}</p><button id="renewCorrection" class="button outline">Enviar nuevo enlace de corrección</button>`;
  if (a.processingError) return '<p class="note">La decisión está bloqueada hasta que se procesen los documentos.</p>';
  return `<form id="reviewForm" class="decision" novalidate>
    <div class="decision-choice" role="group" aria-label="Decisión">
      <button type="button" class="choice approve" data-choice="APPROVED" aria-pressed="false"><span class="ui-icon" data-icon="check"></span>Aprobar</button>
      <button type="button" class="choice observe" data-choice="OBSERVED" aria-pressed="false"><span class="ui-icon" data-icon="alert"></span>Observar</button>
    </div>
    <div id="approvalFields" class="hidden"><label class="check"><input type="checkbox" id="siguConfirmed"> Confirmo que el descuento ya está registrado en SIGU.</label><label for="siguReference">Referencia SIGU (opcional)</label><input type="text" id="siguReference" maxlength="200" placeholder="N.º de operación"></div>
    <div id="observationFields" class="hidden"><label for="category">Motivo</label><select id="category"><option value="">Seleccione un motivo</option>${boot.categories.map(c => `<option>${esc(c)}</option>`).join('')}</select><label for="observation">Mensaje para el estudiante</label><textarea id="observation" maxlength="3000" placeholder="Qué debe corregir y qué documentos enviar"></textarea></div>
    <button id="submitDecision" class="button primary" type="submit" disabled>Guardar y notificar</button>
    <p class="hint">Se notificará a ${esc(a.recipient || 'sin correo válido')}</p>
  </form>`;
}
function renderDetail() {
  releasePreview();
  const {application:a, documents, history, observations, emails} = detail, submissions = detail.submissions || [];
  const position = ids.indexOf(a.id), alerts = issueLines(a);
  $('detailTitle').textContent = a.name || 'Sin nombre';
  $('detailAvatar').textContent = initials(a.name);
  $('detailCode').innerHTML = `<span class="code">${esc(a.id)}</span><span>Revisión ${esc(a.revision)}</span>${status(a.status)}`;
  $('detailPosition').textContent = position >= 0 ? `${position + 1} de ${ids.length}` : '';
  $('prevDetail').disabled = position <= 0; $('nextDetail').disabled = position < 0 || position >= ids.length - 1;
  const facts = [['Correo institucional', a.institutionalEmail], ['Correo personal', a.personalEmail || '—'], ['Documento', `${a.identityType} ${a.identityNumber}`], ['Escuela profesional', a.school], ['Convenio', a.discount + (a.otherDiscount ? ' · ' + a.otherDiscount : '')], ['Envíos', `${a.submissions || 1} · último ${date(a.lastSubmissionAt || a.createdAt)}`]];
  $('detailContent').innerHTML = `<div class="detail-grid"><section class="detail-left">
    ${alerts.length ? `<div class="alerts"><strong>Revise estas alertas</strong><ul>${alerts.map(i => `<li>${esc(i)}</li>`).join('')}</ul><button class="button" data-ack>Marcar como revisadas</button></div>` : ''}
    ${a.processingError ? `<div class="error">Error al procesar documentos: ${esc(a.processingError)}. El sistema lo reintenta automáticamente.</div>` : ''}
    <dl class="facts">${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    <h3>Documentos</h3>${documentList(documents, a.revision)}
    ${observations.length ? '<h3>Observaciones enviadas</h3><ul class="log">' + observations.map(o => `<li><strong>${esc(o.category)}</strong> · ${esc(o.observation)}<small>${date(o.timestamp)}</small></li>`).join('') + '</ul>' : ''}
    <h3>Envíos del estudiante</h3><ul class="log">${submissions.map(e => `<li>Revisión ${esc(e.revision)}${e.correction ? ' · formulario de corrección' : ''} ${e.status === 'DONE' ? '' : status(e.status)}<small>${date(e.timestamp)}</small>${e.error ? `<small>${esc(e.error)}</small>` : ''}</li>`).join('') || '<li>—</li>'}</ul>
    <h3>Historial</h3><ul class="log">${history.map(h => `<li>${esc(labels[h.toStatus] || h.toStatus)}${h.detail ? ' · ' + esc(h.detail) : ''}<small>${date(h.timestamp)} · ${esc(h.reviewer)}</small></li>`).join('')}</ul>
  </section><section class="detail-right"><h2>Decisión</h2>${decisionPanel(a)}
    <h3>Correos enviados</h3>${emails.map(m => `<div class="mail"><span><strong>${esc(emailTypes[m.type] || m.type)}</strong><small>${esc(m.recipient)} · ${date(m.sentAt || m.createdAt)}</small></span>${status(m.status)}</div>`).join('') || '<p class="hint">Aún no hay correos.</p>'}
  </section></div>`;
  wireDecision();
}
function wireDecision() {
  const form = $('reviewForm'); if (!form) return;
  form.onsubmit = prepareDecision;
  form.querySelectorAll('[data-choice]').forEach(button => button.onclick = () => {
    const value = button.dataset.choice; form.dataset.decision = value;
    form.querySelectorAll('[data-choice]').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
    $('approvalFields').classList.toggle('hidden', value !== 'APPROVED'); $('observationFields').classList.toggle('hidden', value !== 'OBSERVED');
    $('submitDecision').disabled = false;
    $('submitDecision').textContent = value === 'APPROVED' ? 'Aprobar y notificar' : 'Enviar observación';
  });
  $('category').onchange = () => {
    const template = boot.templates?.[$('category').value];
    if (template && (!$('observation').value.trim() || $('observation').dataset.auto)) { $('observation').value = template; $('observation').dataset.auto = '1'; }
  };
  $('observation').oninput = () => delete $('observation').dataset.auto;
}
async function openDetail(id) {
  const dialog = $('detailDialog');
  if (dialog.open) $('detailLoading').classList.remove('hidden');
  try { detail = await api('getApplication', id); } finally { $('detailLoading').classList.add('hidden'); }
  renderDetail();
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = 0;
}
async function step(offset) {
  const next = ids[ids.indexOf(detail?.application?.id) + offset];
  if (next) await openDetail(next);
}
function prepareDecision(event) {
  event.preventDefault();
  const a = detail.application, choice = $('reviewForm').dataset.decision;
  if (!choice) return toast('Elija Aprobar u Observar.', true);
  if (choice === 'APPROVED' && !$('siguConfirmed').checked) return toast('Confirme que el descuento está registrado en SIGU.', true);
  if (choice === 'OBSERVED' && (!$('category').value || $('observation').value.trim().length < 10)) return toast('Elija un motivo y escriba la observación (mínimo 10 caracteres).', true);
  pendingDecision = {requestId:crypto.randomUUID(), id:a.id, version:a.version, decision:choice, siguConfirmed:$('siguConfirmed').checked, siguReference:$('siguReference').value, category:$('category').value, observation:$('observation').value};
  $('confirmTitle').textContent = choice === 'APPROVED' ? 'Aprobar solicitud' : 'Observar solicitud';
  $('confirmText').textContent = `${a.name} (${a.id}). Se enviará un correo a ${a.recipient}.`;
  $('confirmDialog').showModal();
}
async function confirmDecision() {
  $('confirmDecision').classList.add('is-loading'); $('confirmDecision').disabled = true; $('cancelDecision').disabled = true;
  try {
    const id = pendingDecision.id, position = ids.indexOf(id), approved = pendingDecision.decision === 'APPROVED';
    const result = await api('saveDecision', pendingDecision);
    $('confirmDialog').close(); pendingDecision = null;
    await Promise.all([showEmailResult(result.email, approved ? 'Aprobación guardada' : 'Observación guardada'), loadApplications().catch(handle)]);
    const next = ids.find((x, i) => i >= position && x !== id);
    if (next) await openDetail(next); else { $('detailDialog').close(); toast('No quedan más solicitudes en esta vista.'); }
  } catch (e) { handle(e); } finally { $('confirmDecision').classList.remove('is-loading'); $('confirmDecision').disabled = false; $('cancelDecision').disabled = false; }
}

/** Tells the reviewer plainly whether the student's email went out, and why not. Resolves when closed. */
function showEmailResult(email, saved) {
  email = email || {status:'PENDING'};
  const sent = email.status === 'SENT', uncertain = email.status === 'UNCERTAIN';
  $('resultIcon').className = 'confirm-icon ' + (sent ? 'ok' : uncertain ? 'bad' : 'warn');
  $('resultIcon').innerHTML = sent ? '<span class="ui-icon" data-icon="check"></span>' : '<span class="ui-icon" data-icon="alert"></span>';
  $('resultTitle').textContent = sent ? 'Correo enviado' : uncertain ? 'No se pudo confirmar el envío' : 'El correo aún no se envió';
  $('resultText').textContent = sent
    ? `${saved}. Google aceptó el correo para ${email.recipient}. Si el estudiante no lo encuentra, que revise Spam y Promociones.`
    : uncertain ? `${saved}, pero el envío a ${email.recipient || 'el estudiante'} falló o no se pudo confirmar. No se reintenta solo para evitar duplicados; revíselo en Correos.`
    : `${saved}. El correo para ${email.recipient || 'el estudiante'} quedó en cola y se enviará automáticamente.`;
  $('resultReason').textContent = email.error ? 'Motivo: ' + email.error : '';
  $('resultReason').classList.toggle('hidden', !email.error);
  $('resultMails').classList.toggle('hidden', sent);
  $('resultDialog').showModal();
  return new Promise(resolve => { $('resultDialog').addEventListener('close', () => resolve($('resultDialog').returnValue), {once:true}); });
}

/* ---------- Emails ---------- */
let emailCache = [];
async function loadEmails() {
  if (!$('emailRows').children.length) $('emailRows').innerHTML = skeletonRows(6, 5);
  emailCache = await api('listEmails');
  renderEmails();
}
function renderEmails() {
  const q = $('mailSearch').value.trim().toLowerCase(), type = $('mailType').value, state = $('mailStatus').value, from = $('mailFrom').value, to = $('mailTo').value;
  const limaDay = v => v ? new Date(Date.parse(v) - 5 * 3600000).toISOString().slice(0, 10) : '';
  const rows = emailCache.filter(m => (!q || [m.applicationId, m.recipient].join(' ').toLowerCase().includes(q)) && (!type || m.type === type) && (!state || m.status === state || (state === 'UNCERTAIN' && m.status === 'SENDING'))
    && (!from || limaDay(m.sentAt || m.createdAt) >= from) && (!to || limaDay(m.sentAt || m.createdAt) <= to));
  $('clearMailFilters').classList.toggle('hidden', !(q || type || state || from || to));
  $('mailCount').textContent = `${rows.length} de ${emailCache.length} correos`;
  $('emailRows').innerHTML = rows.length ? rows.map(m => `<tr><td><button class="link code" data-open="${esc(m.applicationId)}">${esc(m.applicationId)}</button></td><td>${esc(m.recipient)}</td><td>${esc(emailTypes[m.type] || m.type)}</td><td>${date(m.sentAt || m.createdAt)}</td><td>${status(m.status)}${m.error ? `<small>${esc(m.error)}</small>` : ''}</td><td class="row-actions">${m.status === 'PENDING' ? `<button class="button small" data-send-now="${esc(m.key)}">Enviar ahora</button>` : ''}${boot.isAdmin && m.status === 'UNCERTAIN' ? `<button class="button small" data-resolve="${esc(m.key)}" data-resolution="CONFIRM_SENT">Marcar enviado</button> <button class="button small" data-resolve="${esc(m.key)}" data-resolution="REQUEUE">Reintentar</button>` : ''}</td></tr>`).join('')
    : `<tr><td colspan="6" class="empty"><strong>No hay correos aquí</strong>${emailCache.length ? 'Cambie los filtros para ver más.' : 'Los correos enviados a los estudiantes aparecerán aquí.'}</td></tr>`;
}

/* ---------- Start-up and events ---------- */
async function init() {
  const [bootstrap] = await Promise.all([api('getBootstrap'), loadApplications().catch(handle)]);
  boot = bootstrap;
  $('actor').textContent = String(boot.actor).replace(/^gestión:/, ''); $('avatar').textContent = initials(boot.actor); $('period').textContent = boot.period;
  $('pausedBanner').classList.toggle('hidden', boot.emailEnabled); $('demoBanner').classList.toggle('hidden', !window.UMA_DEMO);
  choices('statusFilter', boot.states); choices('discountFilter', boot.discounts); choices('schoolFilter', boot.schools);
  $('queueChips').classList.toggle('hidden', view !== 'pending');
  if (window.UMA_DEMO) $('logoutManagement').classList.add('hidden');
  if (window.UMA_REMOTE) window.UMA_REMOTE.connected();
  const linked = new URLSearchParams(location.hash.slice(1)), applicationId = linked.get('solicitud');
  if (applicationId) { try { await openDetail(applicationId); if (linked.get('documento')) await openViewer(linked.get('documento')); } catch (error) { handle(error); } }
}
const reload = () => { page = 1; updateClearButton(); loadApplications().catch(handle); };
$('navigation').onclick = e => { const tab = e.target.closest('[data-view]'); if (tab) navigate(tab.dataset.view).catch(handle); };
$('refresh').onclick = e => withButton(e.currentTarget, () => navigate(view)).catch(handle);
$('filters').onsubmit = e => { e.preventDefault(); reload(); };
$('search').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(reload, 300); };
['statusFilter','discountFilter','schoolFilter','fromFilter','toFilter'].forEach(id => $(id).onchange = reload);
$('clearFilters').onclick = () => { ['search','discountFilter','schoolFilter','fromFilter','toFilter'].forEach(id => $(id).value = ''); if (!$('statusFilter').disabled) $('statusFilter').value = ''; queue = ''; document.querySelectorAll('[data-queue]').forEach(c => c.classList.toggle('active', c.dataset.queue === '')); reload(); };
$('queueChips').onclick = e => { const chip = e.target.closest('[data-queue]'); if (!chip) return; queue = chip.dataset.queue; document.querySelectorAll('[data-queue]').forEach(c => c.classList.toggle('active', c === chip)); reload(); };
$('mailFilters').onsubmit = e => e.preventDefault();
['mailSearch','mailType','mailStatus','mailFrom','mailTo'].forEach(id => $(id).addEventListener(id === 'mailSearch' ? 'input' : 'change', renderEmails));
$('clearMailFilters').onclick = () => { ['mailSearch','mailType','mailStatus','mailFrom','mailTo'].forEach(id => $(id).value = ''); renderEmails(); };
$('refreshMails').onclick = e => withButton(e.currentTarget, loadEmails).catch(handle);
$('viewerPrev').onclick = () => viewerStep(-1);
$('viewerNext').onclick = () => viewerStep(1);
$('viewerClose').onclick = () => $('viewerDialog').close();
$('viewerDownload').onclick = () => { if (viewerFile) downloadFile(viewerFile); };
$('viewerDialog').addEventListener('close', closeViewer);
$('resultContinue').onclick = () => $('resultDialog').close('continue');
$('resultMails').onclick = () => { $('resultDialog').close('mails'); $('detailDialog').close(); navigate('emails').catch(handle); };
$('prevPage').onclick = () => { page--; loadApplications().catch(handle); };
$('nextPage').onclick = () => { page++; loadApplications().catch(handle); };
$('closeDetail').onclick = () => $('detailDialog').close();
$('prevDetail').onclick = () => step(-1).catch(handle);
$('nextDetail').onclick = () => step(1).catch(handle);
$('cancelDecision').onclick = () => $('confirmDialog').close();
$('confirmDecision').onclick = confirmDecision;
$('detailDialog').addEventListener('close', () => { if ($('viewerDialog').open) $('viewerDialog').close(); releasePreview(); detail = null; });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if ($('viewerDialog').open) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); viewerStep(e.key === 'ArrowRight' ? 1 : -1); } return; }
  if ($('resultDialog').open) return;
  if ($('detailDialog').open && !$('confirmDialog').open && !typing && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) step(e.key === 'ArrowRight' ? 1 : -1).catch(handle);
  if (e.key === 'Enter' && e.target.matches?.('tr[data-open]')) openDetail(e.target.dataset.open).catch(handle);
});
document.addEventListener('click', async e => {
  const open = e.target.closest('[data-open]'), preview = e.target.closest('[data-preview]'), download = e.target.closest('[data-download]'),
    resolve = e.target.closest('[data-resolve]'), goto = e.target.closest('[data-goto]');
  try {
    if (goto) return await navigate(goto.dataset.goto);
    if (e.target.closest('[data-attention]')) { await navigate('pending'); queue = 'attention'; return reload(); }
    if (open && !$('detailDialog').contains(open)) { if ($('detailDialog').open) $('detailDialog').close(); return await openDetail(open.dataset.open); }
    if (preview) await openViewer(preview.dataset.preview);
    if (download) downloadFile(await documentFile(download.dataset.download));
    if (e.target.closest('[data-ack]')) { await withButton(e.target.closest('[data-ack]'), () => api('acknowledgeIssues', detail.application.id, detail.application.version)); await openDetail(detail.application.id); await loadApplications(); toast('Alertas marcadas como revisadas.'); }
    if (e.target.id === 'renewCorrection') { const result = await withButton(e.target, () => api('renewCorrection', detail.application.id)); await showEmailResult(result.email, 'Nuevo enlace de corrección generado'); await openDetail(detail.application.id); }
    const sendNow = e.target.closest('[data-send-now]');
    if (sendNow) { const result = await withButton(sendNow, () => api('sendEmailNow', sendNow.dataset.sendNow)); await loadEmails(); await showEmailResult(result, 'Envío solicitado'); }
    if (resolve) {
      const note = prompt(resolve.dataset.resolution === 'REQUEUE' ? 'Describa cómo comprobó que el correo no llegó. Reintentar puede duplicarlo.' : 'Describa cómo comprobó que el correo fue enviado.');
      if (note) { await api('resolveEmail', resolve.dataset.resolve, resolve.dataset.resolution, note); await loadEmails(); }
    }
  } catch (error) { handle(error); }
});
$('export').onclick = async () => {
  try { const result = await withButton($('export'), () => api('exportExcel', filters())); downloadFile(result); toast(`Excel descargado: ${result.count} solicitudes.`); }
  catch (e) { handle(e); }
};
if (window.UMA_REMOTE) window.UMA_REMOTE.start(init); else init().catch(handle);
})();
</script>
