<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={RECIBIDA:'Recibida',EN_REVISION:'En revisión',OBSERVADA:'Observada',CORRECCION_RECIBIDA:'Subsanación recibida',VALIDADA_PENDIENTE_SIGU:'Pendiente de SIGU',APLICADA_SIGU:'Aplicada en SIGU',PENDING:'En cola',SENDING:'Enviando',SENT:'Aceptado por Google',UNCERTAIN:'Requiere comprobación',CANCELLED:'Reemplazado'};
let boot,view='overview',page=1,total=0,detail=null,pendingDecision=null,busyCount=0,searchTimer,listRequest=0;
const date=v=>v?new Intl.DateTimeFormat('es-PE',{dateStyle:'short',timeStyle:'short',timeZone:'America/Lima'}).format(new Date(v)):'—';
const badge=s=>`<span class="badge ${esc(s)}">${esc(labels[s]||s||'Sin notificación')}</span>`;
const initials=n=>String(n||'').split(' ').filter(Boolean).slice(0,2).map(v=>v[0]).join('').toUpperCase();
const safeUrl=value=>{try{const u=new URL(value);return u.protocol==='https:'&&(['drive.google.com','docs.google.com'].includes(u.hostname))?u.href:'#';}catch{return '#';}};
const link=(url,text)=>`<a href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;
function toast(message,error=false){$('toast').textContent=message;$('toast').className='toast'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),7000);}
async function api(method,...args){
  busyCount++;$('busy').classList.remove('hidden');
  try{
    if(window.UMA_DEMO)return await window.UMA_DEMO.call(method,...args);
    if(window.UMA_REMOTE)return await window.UMA_REMOTE.call(method,...args);
    if(!window.google?.script?.run)throw new Error('Abra el panel desde el despliegue autorizado de Google Apps Script.');
    return await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));
  }finally{if(--busyCount===0)$('busy').classList.add('hidden');}
}
function handle(error){toast(error.message||String(error),true);}
function filters(){return {query:$('search').value.trim(),status:$('statusFilter').value,discount:$('discountFilter').value,school:$('schoolFilter').value,from:$('fromFilter').value,to:$('toFilter').value,pendingOnly:view==='pending'};}
function choices(id,values){values.forEach(v=>{const option=document.createElement('option');option.value=v;option.textContent=labels[v]||v;$(id).append(option);});}
function documentIcon(){return '<span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>'; }
function renderStats(s){
  $('statTotal').textContent=s.total;$('statPending').textContent=s.pending;$('statObserved').textContent=s.observed;$('statApplied').textContent=s.applied;$('navTotal').textContent=s.total;
  $('emailsSent').textContent=s.emailSent;$('emailsPending').textContent=s.emailPending;$('reviewHours').textContent=s.averageReviewHours+' h';$('uncertainCount').textContent=s.emailUncertain?`${s.emailUncertain} envío(s) requieren verificación del administrador.`:'';
  const pairs=Object.entries(s.byDiscount).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...pairs.map(p=>p[1]));
  $('discountChart').innerHTML=pairs.length?pairs.map(([name,n])=>`<div class="bar-row"><span>${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div><strong>${n}</strong></div>`).join(''):'<div class="chart-empty">'+documentIcon()+'<p>La distribución por convenio aparecerá al recibir las primeras solicitudes.</p></div>';
}
async function loadApplications(){
  const request=++listRequest,result=await api('listApplications',filters(),page,20);if(request!==listRequest)return;
  const rows=result.rows;
  total=result.total;renderStats(result.stats);$('resultCount').textContent=total;
  $('applicationRows').innerHTML=rows.length?rows.map(a=>`<tr><td><strong>${esc(a.id)}</strong><small>${date(a.createdAt)}</small></td><td><div class="student-cell"><span class="student-avatar">${esc(initials(a.name))}</span><div><strong>${esc(a.name)}</strong><small>${esc(a.identityType)} ${esc(a.identityNumber)}</small></div></div></td><td class="school-cell">${esc(a.school)}</td><td><span class="discount-pill">${esc(a.discount)}</span></td><td>${badge(a.status)}${a.processingError?'<small style="color:#a23750">Error en documentos</small>':''}</td><td><button class="review-button" data-open="${esc(a.id)}">Revisar</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty"><div class="empty-state">${documentIcon()}<strong>${result.stats.total?'No se encontraron resultados':'Todo listo para recibir solicitudes'}</strong><p>${result.stats.total?'Pruebe otro nombre, documento o una selección de filtros diferente.':'Los expedientes enviados por estudiantes aparecerán aquí para su revisión.'}</p></div></td></tr>`;
  $('paginationText').textContent=total?`${(page-1)*20+1}–${Math.min(page*20,total)} de ${total} solicitudes`:'0 solicitudes';$('pageNumber').textContent=page;$('prevPage').disabled=page<=1;$('nextPage').disabled=page*20>=total;
}
async function navigate(next){
  view=next;page=1;closeMenu();document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const applicationViews=['overview','applications','pending','observed','approved'];
  $('overviewIntro').classList.toggle('hidden',view!=='overview');$('stats').classList.toggle('hidden',!applicationViews.includes(view));$('analytics').classList.toggle('hidden',view!=='overview');$('applicationsPanel').classList.toggle('hidden',!applicationViews.includes(view));
  $('emailsPanel').classList.toggle('hidden',view!=='emails');$('auditPanel').classList.toggle('hidden',view!=='audit');$('settingsPanel').classList.toggle('hidden',view!=='settings');
  const titles={overview:'Resumen de solicitudes',applications:'Todas las solicitudes',pending:'Pendientes de revisión',observed:'Solicitudes observadas',approved:'Descuentos aplicados en SIGU',emails:'Historial de correos',audit:'Auditoría del sistema',settings:'Configuración del sistema'};
  $('pageTitle').textContent=titles[view];$('pageDescription').textContent=view==='overview'?'Cada expediente, en su lugar. Cada decisión, con seguimiento.':'Gestione el proceso de descuentos corporativos del periodo académico.';
  $('export').classList.toggle('hidden',!applicationViews.includes(view));
  if(applicationViews.includes(view)){$('statusFilter').value=view==='observed'?'OBSERVADA':view==='approved'?'APLICADA_SIGU':'';await loadApplications();}
  else if(view==='emails')await loadEmails();else if(view==='settings')await loadHealth();else if(view==='audit')await loadAudit();
}
function renderDetail(){
  const {application:a,documents,history,observations,emails}=detail;
  $('detailTitle').textContent=a.name;$('detailCode').textContent=a.id+' · REVISIÓN '+a.revision;
  const editable=!['APLICADA_SIGU','OBSERVADA'].includes(a.status)&&!a.processingError;
  $('detailContent').innerHTML=`<div class="detail-grid"><section class="detail-left">${badge(a.status)}<dl class="data-grid">${[['Documento',a.identityType+' '+a.identityNumber],['Convenio',a.discount+(a.otherDiscount?' · '+a.otherDiscount:'')],['Correo institucional',a.institutionalEmail],['Correo personal',a.personalEmail||'No registrado'],['Escuela profesional',a.school],['Fecha de envío',date(a.createdAt)],['Revisor',a.reviewer||'Por asignar'],['Correo de notificación',a.recipient]].map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>${a.processingError?`<div class="error-box">${esc(a.processingError)}. El administrador debe corregir la configuración o el archivo y reintentar el evento.</div>`:''}<div class="section-label">Documentación · Todas las revisiones</div><div class="doc-list">${documents.map(d=>`<div class="doc-item"><div><strong>${esc(d.name)}</strong><br><span class="muted">Revisión ${d.revision} · ${d.kind==='socioeconomic'?'Ficha socioeconómica':'Sustento'}</span></div><div><button data-preview="${esc(d.fileId)}">Vista previa</button> ${link(d.url,'Abrir')}</div></div>`).join('')||'<p class="muted">Sin documentos procesados.</p>'}</div><iframe id="documentPreview" class="preview hidden" title="Vista previa del documento" referrerpolicy="no-referrer" allow="fullscreen"></iframe><p class="muted">La vista previa usa su sesión de Google. Si el navegador la bloquea, abra el archivo en Drive.</p>${a.folderUrl?link(a.folderUrl,'Abrir carpeta del expediente'):''}<div class="section-label">Historial del expediente</div><div class="timeline">${history.map(h=>`<div class="timeline-item"><strong>${esc(labels[h.toStatus]||h.toStatus)}</strong><div>${esc(h.detail)}</div><small>${date(h.timestamp)} · ${esc(h.reviewer)}</small></div>`).join('')}</div>${observations.length?'<div class="section-label">Observaciones anteriores</div>'+observations.map(o=>`<div class="notice"><strong>${esc(o.category)}</strong><p>${esc(o.observation)}</p><div>${esc(o.instructions)}</div><small>${date(o.timestamp)} · Revisión ${o.revision}</small></div>`).join(''):''}</section><section class="detail-right"><h2>Resultado de la revisión</h2><p class="muted">Revise todos los documentos antes de registrar una decisión.</p>${editable?`<form id="reviewForm"><label class="field">Decisión<select id="decision" required><option value="">Seleccione un resultado</option><option value="APPROVED">COMPLETADO — APROBADO</option><option value="OBSERVED">COMPLETADO — CON OBSERVACIÓN</option></select></label><div id="approvalFields" class="hidden"><label class="check"><input type="checkbox" id="siguConfirmed">Confirmo que el descuento ya fue registrado en SIGU. Este paso no registra el descuento automáticamente.</label><label class="field">Referencia SIGU (opcional)<input id="siguReference" maxlength="200" placeholder="Referencia de registro"></label></div><div id="observationFields" class="hidden"><label class="field">Categoría<select id="category"><option value="">Seleccione una categoría</option>${boot.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label class="field">Detalle de la observación<textarea id="observation" maxlength="3000" placeholder="Explique qué debe corregirse…"></textarea></label><label class="field">Instrucciones para subsanar<textarea id="instructions" maxlength="3000" placeholder="Indique qué archivos o datos debe presentar…"></textarea></label></div><button class="button primary review-submit" type="submit">Guardar y notificar</button><p class="muted">Destinatario: ${esc(a.recipient)}<br>Remitente: ${esc(boot.owner)}</p></form><div class="sub-actions"><button class="button secondary" data-stage="EN_REVISION">Marcar en revisión</button><button class="button secondary" data-stage="VALIDADA_PENDIENTE_SIGU">Validada · pendiente SIGU</button></div>`:`<div class="notice">${a.status==='APLICADA_SIGU'?'El registro del descuento en SIGU ya fue confirmado.':a.status==='OBSERVADA'?'En espera de que el estudiante presente sus documentos corregidos.':'La revisión está bloqueada por un error de procesamiento.'}</div>${a.status==='OBSERVADA'?'<button id="renewCorrection" class="button secondary">Renovar enlace de subsanación</button>':''}`}<div class="section-label">Notificaciones</div>${emails.map(m=>`<div class="timeline-item"><p>${badge(m.status)} <strong>${m.type==='APPROVED'?'Aprobación':'Observación'}</strong></p><small>${esc(m.recipient)}<br>${date(m.sentAt||m.createdAt)}</small>${m.error?`<p class="muted">${esc(m.error)}</p>`:''}</div>`).join('')||'<p class="muted">Aún no se han generado notificaciones.</p>'}<p class="muted">Los mensajes se procesan mediante el disparador de la cuenta propietaria.</p></section></div>`;
  if(editable){$('decision').onchange=()=>{$('approvalFields').classList.toggle('hidden',$('decision').value!=='APPROVED');$('observationFields').classList.toggle('hidden',$('decision').value!=='OBSERVED');};$('reviewForm').onsubmit=prepareDecision;}
}
async function openDetail(id){detail=await api('getApplication',id);renderDetail();if(!$('detailDialog').open)$('detailDialog').showModal();}
function prepareDecision(event){
  event.preventDefault();const a=detail.application,decision=$('decision').value;
  if(!decision)return toast('Seleccione una decisión.',true);
  if(decision==='APPROVED'&&!$('siguConfirmed').checked)return toast('Confirme primero el registro real en SIGU.',true);
  if(decision==='OBSERVED'&&(!$('category').value||$('observation').value.trim().length<10||$('instructions').value.trim().length<10))return toast('Complete la categoría, la observación y las instrucciones (mínimo 10 caracteres).',true);
  pendingDecision={requestId:crypto.randomUUID(),id:a.id,version:a.version,decision,siguConfirmed:$('siguConfirmed').checked,siguReference:$('siguReference').value,category:$('category').value,observation:$('observation').value,instructions:$('instructions').value};
  $('confirmText').textContent=`${decision==='APPROVED'?'Confirmará que el descuento ya fue ingresado en SIGU':'Registrará la observación y solicitará la subsanación'} para ${a.name}. Se enviará una notificación a ${a.recipient}.`;$('confirmDialog').showModal();
}
async function confirmDecision(){
  $('confirmDecision').disabled=true;
  try{await api('saveDecision',pendingDecision);$('confirmDialog').close();toast('Decisión guardada. La notificación quedó en la cola de la cuenta propietaria.');await openDetail(pendingDecision.id);await loadApplications();pendingDecision=null;}
  catch(e){handle(e);}finally{$('confirmDecision').disabled=false;}
}
async function loadEmails(){const rows=await api('listEmails');$('emailRows').innerHTML=rows.length?rows.map(m=>`<tr><td><button class="review-button" data-open="${esc(m.applicationId)}">${esc(m.applicationId)}</button></td><td>${esc(m.recipient)}</td><td><strong>${m.type==='APPROVED'?'Aprobación':'Observación'}</strong><small>${date(m.sentAt||m.createdAt)}</small></td><td>${badge(m.status)}${m.error?`<small>${esc(m.error)}</small>`:''}</td><td>${boot.isAdmin&&m.status==='UNCERTAIN'?`<button class="button secondary compact" data-resolve="${esc(m.key)}" data-resolution="CONFIRM_SENT">Confirmar enviado</button> <button class="button secondary compact" data-resolve="${esc(m.key)}" data-resolution="REQUEUE">Reintentar</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No hay notificaciones registradas.</td></tr>';}
async function loadHealth(){const h=await api('runSystemHealthCheck');$('healthContent').innerHTML=`<p>${h.ready?'✓ Configuración básica verificada':'Configuración pendiente'}</p><ul class="health-list">${h.issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><p class="muted">Cuota del usuario actual: ${h.quota}. La cuota de envío real es la de la cuenta propietaria.<br>Disparadores visibles para esta cuenta: ${h.triggers.length}.</p>${h.forms.map(f=>`<p>${link(f.editUrl,f.type==='GOOGLE_FORM_ID'?'Editar formulario de solicitud':'Editar formulario de subsanación')} · ${f.accepting?'Abierto':'Cerrado'}</p>`).join('')}`;}
async function loadAudit(){const result=await api('listAudit');$('auditContent').innerHTML='<h2>Errores registrados</h2>'+(result.errors.map(e=>`<div class="error-box"><strong>${esc(e.context)}</strong> · ${date(e.timestamp)}<br>${esc(e.message)}</div>`).join('')||'<p class="muted">Sin errores registrados.</p>')+'<h2>Últimas acciones</h2><div class="timeline">'+result.audit.map(e=>`<div class="timeline-item"><strong>${esc(e.action)}</strong> · ${esc(e.applicationId)}<div>${esc(e.detail)}</div><small>${date(e.timestamp)} · ${esc(e.actor)}</small></div>`).join('')+'</div>';}
async function init(){
  boot=await api('getBootstrap');$('actor').textContent=boot.actor;$('avatar').textContent=initials(boot.actor);$('period').textContent=boot.period;$('headingPeriod').textContent=boot.period;$('sheetLink').href=safeUrl(boot.spreadsheet);$('emailEnabled').checked=boot.emailEnabled;$('pausedBanner').classList.toggle('hidden',boot.emailEnabled);$('demoBanner').classList.toggle('hidden',!window.UMA_DEMO);
  $('domains').value=boot.domains||'';document.querySelectorAll('.admin-only').forEach(e=>e.classList.toggle('hidden',!boot.isAdmin));choices('statusFilter',boot.states);choices('discountFilter',boot.discounts);choices('schoolFilter',boot.schools);await loadApplications();
  if(window.UMA_REMOTE)window.UMA_REMOTE.connected();
}
$('navigation').onclick=e=>{const button=e.target.closest('[data-view]');if(button)navigate(button.dataset.view).catch(handle);};
function closeMenu(){const open=document.querySelector('.sidebar').classList.contains('open');document.querySelector('.sidebar').classList.remove('open');$('mobileMenu').setAttribute('aria-expanded','false');if(open&&matchMedia('(max-width:850px)').matches)$('mobileMenu').focus();}
$('mobileMenu').onclick=()=>{const open=document.querySelector('.sidebar').classList.toggle('open');$('mobileMenu').setAttribute('aria-expanded',String(open));};
$('menuBackdrop').onclick=closeMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
$('refresh').onclick=()=>navigate(view).catch(handle);
$('filters').onsubmit=e=>{e.preventDefault();page=1;loadApplications().catch(handle);};
$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadApplications().catch(handle);},300);};
['statusFilter','discountFilter','schoolFilter','fromFilter','toFilter'].forEach(id=>$(id).onchange=()=>{page=1;loadApplications().catch(handle);});
$('advancedToggle').onclick=()=>{const hidden=$('advancedFilters').classList.toggle('hidden');$('advancedToggle').setAttribute('aria-expanded',String(!hidden));};
$('clearFilters').onclick=()=>{['search','statusFilter','discountFilter','schoolFilter','fromFilter','toFilter'].forEach(id=>$(id).value='');page=1;loadApplications().catch(handle);};
$('prevPage').onclick=()=>{page--;loadApplications().catch(handle);};$('nextPage').onclick=()=>{page++;loadApplications().catch(handle);};
$('closeDetail').onclick=()=>$('detailDialog').close();$('cancelDecision').onclick=()=>$('confirmDialog').close();$('confirmDecision').onclick=confirmDecision;
$('detailDialog').addEventListener('close',()=>{const frame=$('documentPreview');if(frame)frame.src='about:blank';});
document.addEventListener('click',async e=>{
  const open=e.target.closest('[data-open]'),preview=e.target.closest('[data-preview]'),stage=e.target.closest('[data-stage]'),resolve=e.target.closest('[data-resolve]');
  try{
    if(open)await openDetail(open.dataset.open);
    if(preview){const id=preview.dataset.preview;if(!/^[\w-]{10,}$/.test(id))throw new Error('Archivo inválido');$('documentPreview').src='https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview';$('documentPreview').classList.remove('hidden');}
    if(stage){await api('setReviewStatus',detail.application.id,detail.application.version,stage.dataset.stage);await openDetail(detail.application.id);await loadApplications();toast('Estado actualizado.');}
    if(e.target.id==='renewCorrection'){await api('renewCorrection',detail.application.id);await openDetail(detail.application.id);toast('Nuevo enlace generado y notificación en cola.');}
    if(resolve){const note=prompt(resolve.dataset.resolution==='REQUEUE'?'Tras comprobar que el mensaje no fue enviado, documente la verificación. Reintentar puede duplicarlo si ya fue aceptado.':'Documente cómo comprobó que el mensaje fue enviado.');if(note){await api('resolveEmail',resolve.dataset.resolve,resolve.dataset.resolution,note);await loadEmails();}}
  }catch(error){handle(error);}
});
$('export').onclick=async()=>{const button=$('export');button.disabled=true;try{const result=await api('exportExcel',filters());toast(`Excel generado: ${result.count} solicitudes.`);const a=document.createElement('a');a.href=safeUrl(result.url);a.target='_blank';a.rel='noopener';a.textContent='Abrir Excel en Google Drive';$('toast').append(document.createElement('br'),a);a.style.color='white';}catch(e){handle(e);}finally{button.disabled=false;}};
$('settingsForm').onsubmit=async e=>{e.preventDefault();try{await api('updateSettings',{emailEnabled:$('emailEnabled').checked,domains:$('domains').value});boot.emailEnabled=$('emailEnabled').checked;$('pausedBanner').classList.toggle('hidden',boot.emailEnabled);toast('Configuración guardada.');}catch(error){handle(error);}};
$('healthRefresh').onclick=()=>loadHealth().catch(handle);
init().catch(error=>{handle(error);$('applicationRows').innerHTML='<tr><td colspan="6" class="empty">No se pudo conectar con Google. Revise la autorización y el despliegue.</td></tr>';});
})();
</script>
